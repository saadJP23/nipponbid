apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: nipponbid
  labels:
    app: mysql
spec:
  serviceName: mysql-headless   # binds to the headless service
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # mysql-0 = primary (writes), mysql-1 = replica (reads)
      # Full master-replica replication requires init containers with
      # my.cnf injection — simplified here for learning purposes.
      initContainers:
        - name: init-mysql
          image: mysql:8.0
          command:
            - bash
            - "-c"
            - |
              # Assign server-id based on pod ordinal index
              ORDINAL=${HOSTNAME##*-}
              echo "[mysqld]" > /etc/mysql/conf.d/server-id.cnf
              echo "server-id=$((100 + $ORDINAL))" >> /etc/mysql/conf.d/server-id.cnf
              if [[ $ORDINAL -eq 0 ]]; then
                echo "log_bin=mysql-bin" >> /etc/mysql/conf.d/server-id.cnf
              else
                echo "super_read_only=ON" >> /etc/mysql/conf.d/server-id.cnf
              fi
          volumeMounts:
            - name: conf
              mountPath: /etc/mysql/conf.d
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nipponbid-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nipponbid-secrets
                  key: DB_NAME
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: conf
              mountPath: /etc/mysql/conf.d
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mysql", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)", "-e", "SELECT 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
