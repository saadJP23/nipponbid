# CD — runs on every push to main
# 1. Builds Docker images
# 2. Pushes to GitHub Container Registry (GHCR)
# 3. Deploys to local minikube via Helm (self-hosted runner)
name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/saadjp23/nipponbid-frontend
  BACKEND_IMAGE: ghcr.io/saadjp23/nipponbid-backend

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build & push images (GitHub's servers)
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate image tag from git SHA (short) + "latest"
      - name: Extract metadata
        id: meta
        run: echo "version=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Build frontend
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64   # supports both Intel and Apple Silicon
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          platforms: linux/amd64,linux/arm64   # supports both Intel and Apple Silicon
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # JOB 2: Deploy to minikube (self-hosted runner on your Mac)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to minikube
    runs-on: [self-hosted, nipponbid]   # targets your Mac runner by label
    needs: build-and-push  # wait for images to be pushed first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR (pull images into minikube)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      # Pull the new images into minikube's Docker daemon
      - name: Pull images into minikube
        run: |
          eval $(minikube docker-env)
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
          docker pull ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}

          # Re-tag as the version helm will use
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            nipponbid-frontend:${{ needs.build-and-push.outputs.image_tag }}
          docker tag ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            nipponbid-backend:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy with Helm
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          helm upgrade --install nipponbid ./helm \
            --namespace nipponbid \
            --create-namespace \
            --set frontend.image=nipponbid-frontend:${TAG} \
            --set frontend.imagePullPolicy=IfNotPresent \
            --set backend.image=nipponbid-backend:${TAG} \
            --set backend.imagePullPolicy=IfNotPresent \
            --set secrets.dbPassword="${{ secrets.DB_PASSWORD }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --set secrets.cloudinaryApiSecret="${{ secrets.CLOUDINARY_API_SECRET }}" \
            --wait \
            --timeout 3m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend -n nipponbid --timeout=2m
          kubectl rollout status deployment/backend  -n nipponbid --timeout=2m
          kubectl get pods -n nipponbid

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed nipponbid @ ${{ needs.build-and-push.outputs.image_tag }} to minikube"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy failed — rolling back"
          helm rollback nipponbid -n nipponbid
